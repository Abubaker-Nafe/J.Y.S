services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jys
      POSTGRES_USER: jys
      POSTGRES_PASSWORD: jys_local_change_me
    ports:
      - "5432:5432"
    volumes:
      - jys_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jys -d jys"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jys_postgres_data:
